name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "bumpp release type (patch, minor, major, next, prerelease, ...) or an exact version"
        required: true
        default: patch

# cancel-in-progress is off so we never interrupt a half-finished publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: "1.4.2"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not ${GITHUB_REF}."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          bun --bun bumpp --release "$RELEASE" --no-commit --no-tag --no-push --yes --quiet
          VERSION=$(jq -r .version package.json)
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # Standalone binaries via `bun build --compile`.
  # Linux x64/x64-baseline/arm64 for all packages; the CLI also gets macOS and Windows.
  build-binaries:
    name: "Binary: ${{ matrix.package }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: xinity-ai-gateway
            entry: src/gatewayServer.ts
            workdir: packages/xinity-ai-gateway
          - package: xinity-ai-daemon
            entry: src/index.ts
            workdir: packages/xinity-ai-daemon
          - package: xinity-infoserver
            entry: server.ts
            workdir: packages/xinity-infoserver
          - package: xinity-tether
            entry: src/index.ts
            workdir: packages/xinity-tether
          - package: xinity-cli
            binary_name: xinity
            workdir: packages/xinity-cli
            custom_build: true
            targets: "bun-linux-x64 bun-linux-x64-baseline bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64"
          - package: xinity-ai-dashboard
            workdir: packages/xinity-ai-dashboard
            custom_build: true
            pre_build: true
            build_flags: "--no-vite"
            vite_module_lists: ".svelte-kit/output/sbom-modules-*.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - &set-release-version
        name: Set release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun --bun bumpp --release "$VERSION" --no-commit --no-tag --no-push --yes --quiet

      - name: Pre-build (platform-independent step)
        if: ${{ matrix.pre_build }}
        working-directory: ${{ matrix.workdir }}
        run: |
          if [ -f example.env ]; then cp example.env .env; fi
          bun run build

      - name: Compile all targets and package
        working-directory: ${{ matrix.workdir }}
        run: |
          if [ -f example.env ] && [ ! -f .env ]; then cp example.env .env; fi
          BASE_BINARY_NAME="${{ matrix.binary_name || matrix.package }}"
          TARGETS="${{ matrix.targets || 'bun-linux-x64 bun-linux-x64-baseline bun-linux-arm64' }}"

          for target in ${TARGETS}; do
            suffix="${target#bun-}"
            echo "::group::Compiling ${{ matrix.package }} for ${suffix}"

            BINARY_NAME="${BASE_BINARY_NAME}"
            if [[ "$target" == *windows* ]]; then
              BINARY_NAME="${BASE_BINARY_NAME}.exe"
            fi

            if [ "${{ matrix.custom_build || 'false' }}" = "true" ]; then
              bun run build.ts --target "$target" --outfile "${BINARY_NAME}" \
                --metafile "sbom-modules-${suffix}.json" ${{ matrix.build_flags }}
            else
              bun build --compile --minify \
                --sourcemap=external \
                --metafile="sbom-modules-${suffix}.json" \
                --target="${target}" \
                ${{ matrix.entry }} \
                --outfile "${BINARY_NAME}"
            fi

            tar -czf "${{ matrix.package }}-${suffix}.tar.gz" "${BINARY_NAME}" *.map 2>/dev/null || \
              tar -czf "${{ matrix.package }}-${suffix}.tar.gz" "${BINARY_NAME}"
            rm -f "${BINARY_NAME}" *.map

            echo "::endgroup::"
          done

      - name: Generate SBOM
        working-directory: ${{ matrix.workdir }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun ../../scripts/generate-sbom.ts \
            --name "${{ matrix.package }}" \
            --version "$VERSION" \
            --out "${{ matrix.package }}.cdx.json" \
            sbom-modules-*.json ${{ matrix.vite_module_lists }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.package }}
          path: |
            ${{ matrix.workdir }}/*.tar.gz
          retention-days: 1

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.package }}
          path: ${{ matrix.workdir }}/${{ matrix.package }}.cdx.json
          retention-days: 1

  build-bundles:
    name: JS bundles
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - *set-release-version

      - name: Build gateway bundle
        working-directory: packages/xinity-ai-gateway
        run: |
          if [ -f example.env ]; then cp example.env .env; fi
          bun build --production --target=bun \
            --outfile xinity-ai-gateway.js \
            ./src/gatewayServer.ts

      - name: Build daemon bundle
        working-directory: packages/xinity-ai-daemon
        run: |
          if [ -f example.env ]; then cp example.env .env; fi
          bun build --production --target=bun \
            --outfile xinity-ai-daemon.js \
            ./src/index.ts

      - name: Build infoserver bundle
        working-directory: packages/xinity-infoserver
        run: |
          if [ -f example.env ]; then cp example.env .env; fi
          bun build --production --target=bun \
            --outfile xinity-infoserver.js \
            ./server.ts

      - name: Build tether bundle
        working-directory: packages/xinity-tether
        run: |
          if [ -f example.env ]; then cp example.env .env; fi
          bun build --production --target=bun \
            --outfile xinity-tether.js \
            ./src/index.ts

      - name: Package database migrations
        run: tar czf db-migrations.tar.gz -C packages/common-db/db-migration .

      - name: Stage all bundles
        run: |
          mkdir staging
          cp packages/xinity-ai-gateway/xinity-ai-gateway.js staging/
          cp packages/xinity-ai-daemon/xinity-ai-daemon.js staging/
          cp packages/xinity-infoserver/xinity-infoserver.js staging/
          cp packages/xinity-tether/xinity-tether.js staging/
          cp db-migrations.tar.gz staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: staging/
          retention-days: 1

  # Keyless: the signature binds SHASUMS256.txt to this workflow's OIDC identity,
  # so no signing key exists.
  sign:
    name: Sign checksums
    needs: [prepare, build-binaries, build-bundles, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout install scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/install.sh
            scripts/install.ps1
            scripts/combine-sbom.ts
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Download binary and image SBOMs
        uses: actions/download-artifact@v5
        with:
          path: sbom-parts
          pattern: sbom-*
          merge-multiple: true

      - name: Add install scripts to release
        run: |
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Combine release SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/combine-sbom.ts --version "$VERSION" --out release/sbom.cdx.json sbom-parts/*.cdx.json

      - name: Generate SHASUMS256.txt
        working-directory: release
        run: sha256sum * | sort > SHASUMS256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SHASUMS256.txt
        working-directory: release
        run: cosign sign-blob --yes --bundle SHASUMS256.txt.sigstore.json SHASUMS256.txt

      - name: Upload signed checksums
        uses: actions/upload-artifact@v5
        with:
          name: signed-checksums
          path: |
            release/SHASUMS256.txt
            release/SHASUMS256.txt.sigstore.json
          retention-days: 1

      - name: Upload release SBOM
        uses: actions/upload-artifact@v5
        with:
          name: release-sbom
          path: release/sbom.cdx.json
          retention-days: 1

  build-images:
    name: "Image: ${{ matrix.image }}"
    needs: [prepare, tests, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xinity-ai-gateway
            dockerfile: ci/dockerfiles/Dockerfile.gateway
          - image: xinity-ai-dashboard
            dockerfile: ci/dockerfiles/Dockerfile.dashboard
          - image: xinity-infoserver
            dockerfile: ci/dockerfiles/Dockerfile.infoserver
          - image: xinity-tether
            dockerfile: ci/dockerfiles/Dockerfile.tether
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: ci/dockerfiles
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binary artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ matrix.image }}
          path: .artifacts

      - name: Download binary SBOM
        uses: actions/download-artifact@v5
        with:
          name: sbom-${{ matrix.image }}
          path: .sbom

      - name: Organize binaries by arch
        run: |
          mkdir -p build-context/linux/amd64 build-context/linux/arm64
          for f in .artifacts/*.tar.gz; do
            name=$(basename "$f" .tar.gz)
            # Skip x64-baseline tarball; it's for standalone installs, not containers
            case "$name" in
              *baseline*) continue ;;
            esac
            case "$name" in
              *arm64) tar -xzf "$f" -C build-context/linux/arm64/ ;;
              *x64)   tar -xzf "$f" -C build-context/linux/amd64/ ;;
            esac
          done
          find build-context -type f

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=Xinity AI
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./build-context
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false  # Disable attestation manifests; GHCR rejects cross-blob HEAD requests they trigger on multi-arch pushes (403)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAMESPACE}/${{ matrix.image }}@${DIGEST}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Generate image SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .digest' \
            | while read -r platform_digest; do
                syft scan "registry:${IMAGE}@${platform_digest}" \
                  -o "cyclonedx-json=platform-${platform_digest#sha256:}.cdx.json"
              done
          mkdir image-sbom
          jq -s \
            --arg name "${IMAGE}" \
            --arg version "$VERSION" \
            --arg purl "pkg:oci/${{ matrix.image }}@${DIGEST/:/%3A}?repository_url=${IMAGE}" '
              ([.[:-1][].components[] | select(.type != "file")] | unique_by(."bom-ref")) as $packages
              | {
                  metadata: {component: {type: "container", "bom-ref": $purl, name: $name, version: $version, purl: $purl, licenses: .[-1].metadata.component.licenses}},
                  components: $packages,
                  dependencies: [{ref: $purl, dependsOn: ([$packages[]."bom-ref"] + [.[-1].metadata.component."bom-ref"])}]
                }' platform-*.cdx.json ".sbom/${{ matrix.image }}.cdx.json" > "image-sbom/${{ matrix.image }}-image.cdx.json"

      - name: Upload image SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.image }}-image
          path: image-sbom/
          retention-days: 1

  # The only job that writes to the repository: one release commit carrying the
  # version bump, the changelog and nix/release.json, pushed together with its tag.
  # A push to main by anyone else between dispatch and here rejects the push, since
  # rebasing would publish a tree other than the one that was built and tested.
  publish:
    name: Publish release
    needs: [prepare, tests, build-binaries, build-bundles, sign, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4199259
          private-key: ${{ secrets.NIX_RELEASE_APP_PRIVATE_KEY }}
          owner: xinity-ai

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Download signed checksums
        uses: actions/download-artifact@v5
        with:
          name: signed-checksums
          path: release

      - name: Add install scripts to release
        run: |
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - *set-release-version

      - name: Prepend changelog
        run: bash scripts/update-changelog.sh

      - name: Regenerate nix/release.json
        run: |
          bun scripts/update-nix-release.ts \
            --tag "${TAG}" \
            --shasums release/SHASUMS256.txt \
            --release-json nix/release.json

      - name: Commit and tag
        run: |
          git config user.name "xinity-release-bot[bot]"
          git config user.email "4199259+xinity-release-bot[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md nix/release.json
          git commit -m "chore: release ${TAG}" -m "[skip ci]"
          git tag -a "${TAG}" -m "${TAG}"

      - name: Generate changelog for this release
        run: |
          {
            echo 'RELEASE_NOTES<<CLIFF_EOF'
            bunx git-cliff --latest --strip header
            echo 'CLIFF_EOF'
          } >> "$GITHUB_ENV"

      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${TAG}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release/*
          body: |
            ${{ env.RELEASE_NOTES }}

            ---
            ## Quick Install (CLI)

            **Linux / macOS:**
            ```bash
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/install.sh" \
              | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/install.ps1" | iex
            ```

            ## Install (services)

            **Standalone binary** (no dependencies):

            ```bash
            # x64 (Haswell+, 2013 and later, recommended)
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-x64.tar.gz" \
              -o gateway.tar.gz
            tar -xzf gateway.tar.gz
            chmod +x xinity-ai-gateway
            ./xinity-ai-gateway

            # x64-baseline (Nehalem+, maximum compatibility)
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-x64-baseline.tar.gz" \
              -o gateway.tar.gz

            # arm64
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-arm64.tar.gz" \
              -o gateway.tar.gz
            ```

            Replace `xinity-ai-gateway` with `xinity-ai-daemon`, `xinity-infoserver`, or `xinity-ai-dashboard` as needed.

            **JS bundle** (requires [Bun](https://bun.sh)):

            ```bash
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway.js" \
              -o xinity-ai-gateway.js
            bun run xinity-ai-gateway.js
            ```

            **Container image** (multi-arch, `linux/amd64` and `linux/arm64`):

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-ai-gateway:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-ai-dashboard:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-infoserver:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-tether:${{ needs.prepare.outputs.version }}
            ```

            ## Verify

            Downloads are verified against `SHASUMS256.txt`, which is signed by this repository's release workflow. Verifying the signature requires [cosign](https://docs.sigstore.dev/cosign/system_config/installation/).

            ```bash
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/SHASUMS256.txt" \
              -o SHASUMS256.txt
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/SHASUMS256.txt.sigstore.json" \
              -o SHASUMS256.txt.sigstore.json
            cosign verify-blob SHASUMS256.txt \
              --bundle SHASUMS256.txt.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            sha256sum -c SHASUMS256.txt --ignore-missing
            ```

            Container images are signed by the same workflow:

            ```bash
            cosign verify ghcr.io/${{ github.repository_owner }}/xinity-ai-gateway:${{ needs.prepare.outputs.version }} \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            ---
