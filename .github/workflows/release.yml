name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "bumpp release type (patch, minor, major, next, prerelease, ...) or an exact version"
        required: true
        default: patch

# cancel-in-progress is off so we never interrupt a half-finished publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: "1.4.2"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not ${GITHUB_REF}."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          bun --bun bumpp --release "$RELEASE" --no-commit --no-tag --no-push --yes --quiet
          VERSION=$(jq -r .version package.json)
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  release-build:
    name: Build release
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write

  # Keyless. The signature binds SHASUMS256.txt to this file's OIDC identity
  # (release.yml@refs/heads/main). Installed CLIs accept only that identity, so
  # signing stays here. The checksum bytes were attested in release-build.yml
  # and are not regenerated.
  sign-checksums:
    name: Sign checksums
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v5
        with:
          name: shasums
          path: checksums

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SHASUMS256.txt
        working-directory: checksums
        run: |
          mapfile -t files < <(find . -name SHASUMS256.txt -type f)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Expected one SHASUMS256.txt in the checksum artifact, found ${#files[@]}."
            exit 1
          fi
          dir=$(dirname "${files[0]}")
          cosign sign-blob --yes --bundle "${dir}/SHASUMS256.txt.sigstore.json" "${files[0]}"
          mkdir -p "$GITHUB_WORKSPACE/signed"
          cp "${files[0]}" "$GITHUB_WORKSPACE/signed/SHASUMS256.txt"
          cp "${dir}/SHASUMS256.txt.sigstore.json" "$GITHUB_WORKSPACE/signed/SHASUMS256.txt.sigstore.json"

      - name: Upload signed checksums
        uses: actions/upload-artifact@v5
        with:
          name: signed-checksums
          path: |
            signed/SHASUMS256.txt
            signed/SHASUMS256.txt.sigstore.json
          if-no-files-found: error
          retention-days: 1

  sign-images:
    name: Sign images
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          pattern: image-digest-*
          path: image-digests

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Same four images as release-build.yml. Sign the artifact bytes, not a tag.
      - name: Sign images
        run: |
          expected=(xinity-ai-gateway xinity-ai-dashboard xinity-infoserver xinity-tether)
          count=$(find image-digests -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | wc -l)
          if [[ "$count" -ne ${#expected[@]} ]]; then
            echo "::error::Expected ${#expected[@]} image digest artifacts, found ${count}."
            exit 1
          fi
          declare -A digests=()
          for image in "${expected[@]}"; do
            file="image-digests/image-digest-${image}/digest.txt"
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing digest for ${image}."
              exit 1
            fi
            digest=$(tr -d '[:space:]' < "$file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Digest for ${image} is not a sha256 manifest list."
              exit 1
            fi
            digests["$image"]="$digest"
          done
          for image in "${expected[@]}"; do
            cosign sign --yes "${IMAGE_NAMESPACE}/${image}@${digests[$image]}"
          done

  # The only job that writes to the repository: one release commit carrying the
  # version bump, the changelog and nix/release.json, pushed together with its tag.
  # A push to main by anyone else between dispatch and here rejects the push, since
  # rebasing would publish a tree other than the one that was built and tested.
  publish:
    name: Publish release
    needs: [prepare, release-build, sign-checksums, sign-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4199259
          private-key: ${{ secrets.NIX_RELEASE_APP_PRIVATE_KEY }}
          owner: xinity-ai

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Download signed checksums
        uses: actions/download-artifact@v5
        with:
          name: signed-checksums
          path: release

      - name: Add install scripts to release
        run: |
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun --bun bumpp --release "$VERSION" --no-commit --no-tag --no-push --yes --quiet

      - name: Prepend changelog
        run: bash scripts/update-changelog.sh

      - name: Regenerate nix/release.json
        run: |
          bun scripts/update-nix-release.ts \
            --tag "${TAG}" \
            --shasums release/SHASUMS256.txt \
            --release-json nix/release.json

      - name: Commit and tag
        run: |
          git config user.name "xinity-release-bot[bot]"
          git config user.email "4199259+xinity-release-bot[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md nix/release.json
          git commit -m "chore: release ${TAG}" -m "[skip ci]"
          git tag -a "${TAG}" -m "${TAG}"

      - name: Generate changelog for this release
        run: |
          {
            echo 'RELEASE_NOTES<<CLIFF_EOF'
            bunx git-cliff --latest --strip header
            echo 'CLIFF_EOF'
          } >> "$GITHUB_ENV"

      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${TAG}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release/*
          body: |
            ${{ env.RELEASE_NOTES }}

            ---
            ## Quick Install (CLI)

            **Linux / macOS:**
            ```bash
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/install.sh" \
              | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/install.ps1" | iex
            ```

            ## Install (services)

            **Standalone binary** (no dependencies):

            ```bash
            # x64 (Haswell+, 2013 and later, recommended)
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-x64.tar.gz" \
              -o gateway.tar.gz
            tar -xzf gateway.tar.gz
            chmod +x xinity-ai-gateway
            ./xinity-ai-gateway

            # x64-baseline (Nehalem+, maximum compatibility)
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-x64-baseline.tar.gz" \
              -o gateway.tar.gz

            # arm64
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-arm64.tar.gz" \
              -o gateway.tar.gz
            ```

            Replace `xinity-ai-gateway` with `xinity-ai-daemon`, `xinity-infoserver`, or `xinity-ai-dashboard` as needed.

            **JS bundle** (requires [Bun](https://bun.sh)):

            ```bash
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway.js" \
              -o xinity-ai-gateway.js
            bun run xinity-ai-gateway.js
            ```

            **Container image** (multi-arch, `linux/amd64` and `linux/arm64`):

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-ai-gateway:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-ai-dashboard:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-infoserver:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/xinity-tether:${{ needs.prepare.outputs.version }}
            ```

            ## Verify

            Downloads are verified against `SHASUMS256.txt`, which is signed by this repository's release workflow. Verifying the signature requires [cosign](https://docs.sigstore.dev/cosign/system_config/installation/).

            ```bash
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/SHASUMS256.txt" \
              -o SHASUMS256.txt
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/SHASUMS256.txt.sigstore.json" \
              -o SHASUMS256.txt.sigstore.json
            cosign verify-blob SHASUMS256.txt \
              --bundle SHASUMS256.txt.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            sha256sum -c SHASUMS256.txt --ignore-missing
            ```

            Container images are signed by the same workflow:

            ```bash
            cosign verify ghcr.io/${{ github.repository_owner }}/xinity-ai-gateway:${{ needs.prepare.outputs.version }} \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Build provenance names the parent of this tag. Pinning `--signer-workflow` is what makes the check SLSA Build Level 3; without it the check is only Level 2.

            ```bash
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/xinity-ai-gateway-linux-x64.tar.gz" \
              -o xinity-ai-gateway-linux-x64.tar.gz
            gh attestation verify xinity-ai-gateway-linux-x64.tar.gz \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release-build.yml
            gh attestation verify oci://ghcr.io/${{ github.repository_owner }}/xinity-ai-gateway:${{ needs.prepare.outputs.version }} \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release-build.yml
            ```

            ---
