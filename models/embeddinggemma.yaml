# yaml-language-server: $schema=https://sysinfo.xinity.ai/schemas/model.v2.json

models:
  embeddinggemma-300m-vllm:
    name: EmbeddingGemma 300M
    description: |
      Google's small text-embedding model, built on the Gemma 3 backbone and trained
      for retrieval, semantic search, clustering and classification across a wide
      range of languages.

      It is tiny enough to sit alongside a generation model on the same card, which
      is the usual reason to pick it: a retrieval pipeline can embed locally instead
      of shipping documents to a hosted embedding API.

      Its input window is 2048 tokens, short by current standards, so longer
      documents have to be chunked before embedding. It only produces embeddings;
      it cannot chat, and requests to the chat endpoints are rejected.

      It expects its task prompts, and this one is not optional. Prefix a query with
      `task: search result | query: ` and a document with `title: none | text: `.
      Embedded bare, everything it is shown lands between 0.90 and 0.95 cosine of
      everything else and relevant barely outranks irrelevant; with the prompts the
      same comparison separates by an order of magnitude more. Other tasks have their
      own query prefixes, among them `task: clustering | query: `,
      `task: classification | query: ` and `task: sentence similarity | query: `. The
      query prefix and the document prefix must belong to the same task.
    url: https://huggingface.co/google/embeddinggemma-300m
    license:
      name: Gemma Terms of Use
      url: https://ai.google.dev/gemma/terms
      use: conditional
      summary: >
        Commercial use is allowed, with no revenue or user threshold, but Google's
        Prohibited Use Policy applies and must be passed on to downstream recipients
        together with a copy of the terms. Google reserves the right to restrict
        usage, remotely or otherwise, where it believes the terms are being violated.
    createdAt: 2025-07-17
    registeredAt: 2026-08-18
    engine: vllm
    engineSpecifier: google/embeddinggemma-300m
    sizing:
      # 24 layers, 1 kv head, head_dim 256. 20 of the 24 are sliding-window, so
      # attentionWindow caps what a long request holds. Note the pooling runner does
      # not reserve a paged KV cache the way a generative model does. vLLM logs no
      # cache size at all, so this figure only keeps the capacity estimate honest.
      kvBytesPerToken: 24576
      attentionWindow: 512
      maxContextLength: 2048
      # The checkpoint is float32 on disk but vLLM loads it bf16 (dtype=torch.bfloat16),
      # so this is the measured resident 0.57 GiB, not the 1.2 GB of files.
      weightGb: 0.61
      weightBits: 16
    type: embedding
    family: EmbeddingGemma
    tags: []

  embeddinggemma-300m-ollama: &eg-ollama
    name: EmbeddingGemma 300M (Ollama)
    description: |
      The same EmbeddingGemma as the vLLM entry, served by Ollama from the library GGUF.
      768-dimension vectors over a 2K window, which is short for an embedder, so chunk to
      match it.

      This entry is the bf16 build, the one to pick when quality matters more than
      footprint. The two QAT entries are quantization-aware-trained builds that cut the
      footprint to roughly a half and a third for the same vector dimension.
    url: https://ollama.com/library/embeddinggemma
    license:
      name: Gemma Terms of Use
      url: https://ai.google.dev/gemma/terms
      use: conditional
      summary: >
        Commercial use and redistribution are permitted. The use restrictions have to be
        passed through to downstream users, and Google may update the prohibited-use
        policy.
    createdAt: 2025-07-17
    registeredAt: 2026-09-26
    engine: ollama
    engineSpecifier: embeddinggemma:300m
    variantOf: embeddinggemma-300m-vllm
    sizing: &eg-ollama-kv
      # 24 layers, 1 kv head, head_dim 256 -> 2 * 24 * 1 * 256 * 2.
      kvBytesPerToken: 24576
      maxContextLength: 2048
      weightGb: 0.62
      weightBits: 16
    type: embedding
    family: EmbeddingGemma
    tags: []
    engineVersions:
      min: "0.33.1"

  embeddinggemma-300m-qat-q8-ollama:
    <<: *eg-ollama
    name: EmbeddingGemma 300M QAT Q8 (Ollama)
    description: |
      EmbeddingGemma in a quantization-aware-trained 8-bit build, a little over half the
      memory of the bf16 entry for the same 768-dimension vectors and the same 2K window.

      QAT means the quantization was trained for rather than applied afterwards, so this
      is the one to reach for when the bf16 entry does not fit. Take the Q4 entry if it
      still does not.
    engineSpecifier: embeddinggemma:300m-qat-q8_0
    sizing:
      <<: *eg-ollama-kv
      weightGb: 0.34
      weightBits: 8

  embeddinggemma-300m-qat-q4-ollama:
    <<: *eg-ollama
    name: EmbeddingGemma 300M QAT Q4 (Ollama)
    description: |
      EmbeddingGemma in a quantization-aware-trained 4-bit build, the smallest way to run
      it at roughly a third of the bf16 footprint, with the same 768-dimension vectors and
      2K window.

      Small enough to sit alongside a chat model on a modest node. Prefer the Q8 or bf16
      entry when retrieval quality is the binding constraint.
    engineSpecifier: embeddinggemma:300m-qat-q4_0
    sizing:
      <<: *eg-ollama-kv
      weightGb: 0.24
      weightBits: 4
