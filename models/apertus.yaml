# yaml-language-server: $schema=https://sysinfo.xinity.ai/schemas/model.v2.json
#
# Apertus, the Swiss AI Initiative's fully open model line: open weights, open data and
# open training recipe. Two generations are here: the 2509 8B release, and the much
# smaller v1.1 "mini" line.

models:
  apertus-8b-2509-vllm:
    name: Apertus 8B Instruct 2509
    description: |
      A fully open 8B instruction model from the Swiss AI Initiative: the weights, the
      training data and the recipe are all published, which makes it a reasonable
      default where provenance matters more than raw benchmark position.

      It is strongly multilingual, covering over a thousand languages including ones
      most open models neglect, it calls tools, and it was trained only on data whose
      robots.txt permitted crawling.

      Its 65K context is the longest in this family by a wide margin, but that also
      makes it the only Apertus entry with a substantial cache floor.
    url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509
    license: apache-2.0
    createdAt: 2025-08-13
    registeredAt: 2026-08-18
    engine: vllm
    engineSpecifier: swiss-ai/Apertus-8B-Instruct-2509
    sizing:
      # 32 layers, 8 kv heads, head_dim 128 -> 2 * 32 * 8 * 128 * 2
      kvBytesPerToken: 131072
      maxContextLength: 65536
      weightGb: 16.13  # measured resident, 15.02 GiB
      weightBits: 16
    type: chat
    family: Apertus
    tags: [tools]
    engineVersions:
      min: "0.22.0"
    engineArgs:
      - --tool-call-parser
      - apertus
      # The repo's own chat_template.jinja, corrected in exactly two places. Upstream it
      # reads tool.description off the OpenAI {type, function} envelope instead of
      # unwrapping it, and concatenates tool_call.function.arguments as a string when
      # vLLM hands it a dict. The first breaks every request that declares a tool, the
      # second breaks every follow-up turn that carries a tool result. No corrected
      # template ships in the model repo or in vLLM, hence the copy.
      - --chat-template
      - |-
        {%- macro render_typescript_type(param_spec, required_params, is_nullable=false) -%}
            {%- if param_spec.type == "array" -%}
                {%- if param_spec['items'] -%}
                    {%- if param_spec['items']['type'] == "string" -%}
                        {{- "string[]" }}
                    {%- elif param_spec['items']['type'] == "number" -%}
                        {{- "number[]" }}
                    {%- elif param_spec['items']['type'] == "integer" -%}
                        {{- "number[]" }}
                    {%- elif param_spec['items']['type'] == "boolean" -%}
                        {{- "boolean[]" }}
                    {%- else -%}
                        {%- set inner_type = render_typescript_type(param_spec['items'], required_params) -%}
                        {%- if inner_type == "object | object" or inner_type|length > 50 -%}
                            {{- "any[]" }}
                        {%- else -%}
                            {{- inner_type + "[]" }}
                        {%- endif -%}
                    {%- endif -%}
                    {%- if param_spec.nullable -%}
                        {{- " | null" }}
                    {%- endif -%}
                {%- else -%}
                    {{- "any[]" }}
                    {%- if param_spec.nullable -%}
                        {{- " | null" }}
                    {%- endif -%}
                {%- endif -%}
            {%- elif param_spec.type is defined and param_spec.type is iterable and param_spec.type is not string and param_spec.type is not mapping and param_spec.type[0] is defined -%}
                {#- Handle array of types like ["object", "object"] from Union[dict, list] #}
                {%- if param_spec.type | length > 1 -%}
                    {{- param_spec.type | join(" | ") }}
                {%- else -%}
                    {{- param_spec.type[0] }}
                {%- endif -%}
            {%- elif param_spec.oneOf -%}
                {#- Handle oneOf schemas - check for complex unions and fallback to any #}
                {%- set has_object_variants = false -%}
                {%- for variant in param_spec.oneOf -%}
                    {%- if variant.type == "object" -%}
                        {%- set has_object_variants = true -%}
                    {%- endif -%}
                {%- endfor -%}
                {%- if has_object_variants and param_spec.oneOf|length > 1 -%}
                    {{- "any" }}
                {%- else -%}
                    {%- for variant in param_spec.oneOf -%}
                        {{- render_typescript_type(variant, required_params) -}}
                        {%- if variant.description %}
                            {{- "// " + variant.description }}
                        {%- endif -%}
                        {%- if variant.default is defined %}
                            {{ "// default: " + variant.default|tojson }}
                        {%- endif -%}
                        {%- if not loop.last %}
                            {{- " | " }}
                        {% endif -%}
                    {%- endfor -%}
                {%- endif -%}
            {%- elif param_spec.type == "string" -%}
                {%- if param_spec.enum -%}
                    {{- '"' + param_spec.enum|join('" | "') + '"' -}}
                {%- else -%}
                    {{- "string" }}
                    {%- if param_spec.nullable %}
                        {{- " | null" }}
                    {%- endif -%}
                {%- endif -%}
            {%- elif param_spec.type == "number" -%}
                {{- "number" }}
            {%- elif param_spec.type == "integer" -%}
                {{- "number" }}
            {%- elif param_spec.type == "boolean" -%}
                {{- "boolean" }}
            {%- elif param_spec.type == "object" -%}
                {%- if param_spec.properties -%}
                    {{- "{\n" }}
                    {%- for prop_name, prop_spec in param_spec.properties.items() -%}
                        {{- prop_name -}}
                        {%- if prop_name not in (param_spec.required or []) -%}
                            {{- "?" }}
                        {%- endif -%}
                        {{- ": " }}
                        {{ render_typescript_type(prop_spec, param_spec.required or []) }}
                        {%- if not loop.last -%}
                            {{-", " }}
                        {%- endif -%}
                    {%- endfor -%}
                    {{- "}" }}
                {%- else -%}
                    {{- "object" }}
                {%- endif -%}
            {%- else -%}
                {{- "any" }}
            {%- endif -%}
        {%- endmacro -%}

        {%- macro render_tools(tools) -%}
            {%- for entry in tools %}
                {%- set tool = entry.function if entry.function is defined else entry %}
                {{- "// " + tool.description + "\n" }}
                {{- "type "+ tool.name + " = " }}
                {%- if tool.parameters and tool.parameters.properties %}
                    {{- "(_: {\n" }}
                    {%- for param_name, param_spec in tool.parameters.properties.items() %}
                        {%- if param_spec.description %}
                            {{- "// " + param_spec.description + "\n" }}
                        {%- endif %}
                        {{- param_name }}
                        {%- if param_name not in (tool.parameters.required or []) -%}
                            {{- "?" }}
                        {%- endif -%}
                        {{- ": " }}
                        {{- render_typescript_type(param_spec, tool.parameters.required or []) }}
                        {%- if param_spec.default is defined -%}
                            {%- if param_spec.enum %}
                                {{- ", // default: " + param_spec.default }}
                            {%- elif param_spec.oneOf %}
                                {{- "// default: " + param_spec.default }}
                            {%- else %}
                                {{- ", // default: " + param_spec.default|tojson }}
                            {%- endif -%}
                        {%- endif -%}
                        {%- if not loop.last %}
                            {{- ",\n" }}
                        {%- else %}
                            {{- "\n" }}
                        {%- endif -%}
                    {%- endfor %}
                    {{- "}) => any;" }}
                {%- else -%}
                    {{- "() => any;" }}
                {%- endif -%}
                {%- if not loop.last -%}
                    {{- "\n" }}
                {%- endif -%}
            {%- endfor %}
        {%- endmacro -%}

        {{ bos_token }}

        {%- set system_token = '<|system_start|>' -%}
        {%- set end_system_token = '<|system_end|>' -%}
        {%- set developer_token = '<|developer_start|>' -%}
        {%- set end_developer_token = '<|developer_end|>' -%}
        {%- set user_token = '<|user_start|>' -%}
        {%- set end_user_token = '<|user_end|>' -%}
        {%- set assistant_token = '<|assistant_start|>' -%}
        {%- set end_assistant_token = '<|assistant_end|>' -%}
        {%- set inner_token = '<|inner_prefix|>' -%}
        {%- set outer_token = '<|inner_suffix|>' -%}
        {%- set tool_calls_token = '<|tools_prefix|>' -%}
        {%- set end_tool_calls_token = '<|tools_suffix|>' -%}
        {%- set image_token = '<|image|>' -%}

        {%- set ns = namespace(in_assistant=false, in_tool=false, in_inner=false, waiting_for_tool_outputs=false, assistant_format=none) -%}

        {%- if messages and messages[0].role == 'system' -%}
            {%- if "content" in messages[0] -%}
                {%- if messages[0].content is string -%}
                    {{ system_token + messages[0].content + end_system_token }}
                {%- elif messages[0].content is mapping and "text" in messages[0].content -%}
                    {{ system_token + messages[0].content.text + end_system_token }}
                {%- else -%}
                    {{- raise_exception("Invalid system message") -}}
                {%- endif -%}
            {%- else -%}
                {{- raise_exception("Invalid system message") -}}
            {%- endif -%}
            {%- set loop_messages = messages[1:] -%}
        {%- else -%}
            {{ system_token + 'You are Apertus, a helpful assistant created by the SwissAI initiative.\nKnowledge cutoff: 2024-04\nCurrent date: ' + strftime_now('%Y-%m-%d') + end_system_token }}
            {%- set loop_messages = messages -%}
        {%- endif -%}

        {{ developer_token + 'Deliberation: ' }}
        {%- if enable_thinking is defined and enable_thinking -%}
            {{ 'enabled\n' }}
        {%- else -%}
            {{ 'disabled\n' }}
        {%- endif -%}
        {%- if tools is defined and tools -%}
            {{ 'Tool Capabilities:\n' + render_tools(tools) }}
        {%- else -%}
            {{ 'Tool Capabilities: disabled' }}
        {%- endif -%}
        {{ end_developer_token }}

        {%- for message in loop_messages -%}
            {%- if message.role == 'user' -%}
                {%- set ns.in_inner = false -%}
                {%- if ns.in_tool -%}
                    {{ ']' }}
                    {%- set ns.in_tool = false -%}
                {%- endif -%}
                {%- if ns.in_assistant -%}
                    {{ end_assistant_token }}
                    {%- set ns.in_assistant = false -%}
                {%- endif -%}
                {%- if "content" in message -%}
                    {{ user_token }}
                    {%- if message.content is string -%}
                        {{ message.content }}
                    {%- elif message.content is mapping and "parts" in message.content -%}
                        {%- set parts = message.content.parts -%}
                        {%- for part in parts -%}
                            {%- if part.type == "text" -%}
                                {{ part.text }}
                            {%- elif part.type == "image" -%}
                                {{ image_token }}
                            {%- else -%}
                                {{- raise_exception("Invalid user part: " + part.type) -}}
                            {%- endif -%}
                        {%- endfor -%}
                    {%- else -%}
                        {{- raise_exception("Invalid user message: " + message.role) -}}
                    {%- endif -%}
                    {{ end_user_token }}
                {%- endif -%}
            {%- elif message.role == 'assistant' -%}
                {%- if not ns.in_assistant -%}
                    {{ assistant_token }}
                    {%- set ns.in_assistant = true -%}
                {%- endif -%}
                {%- if "content" in message -%}
                    {%- if message.content is string and (ns.assistant_format is none or ns.assistant_format == "string") -%}
                        {%- if ns.in_tool -%}
                            {{ ']' }}
                            {%- set ns.in_tool = false -%}
                        {%- endif -%}
                        {%- set ns.assistant_format = "string" -%}
                        {{ message.content }}
                    {%- elif message.content is mapping and "blocks" in message.content and (ns.assistant_format is none or ns.assistant_format == "mapping") -%}
                        {%- set ns.assistant_format = "mapping" -%}
                        {%- set blocks = message.content.blocks -%}
                        {%- for block in blocks -%}
                            {%- if block.type == 'thoughts' -%}
                                {%- if ns.in_tool -%}
                                    {{ ']' }}
                                    {%- set ns.in_tool = false -%}
                                {%- endif -%}
                                {%- if not ns.in_inner -%}
                                    {%- set ns.in_inner = true -%}
                                    {{ inner_token }}
                                {%- endif -%}
                                {{ block.text }}
                            {%- elif block.type == 'tool_calls' -%}
                                {%- if ns.in_tool -%}
                                    {{ ']' }}
                                    {%- set ns.in_tool = false -%}
                                {%- endif -%}
                                {%- if ns.in_inner and not loop.first and block.calls|length == 1 and block.calls[0].name == 'display_answers' -%}
                                    {%- set ns.in_inner = false -%}
                                    {{ outer_token }}
                                {%- endif -%}
                                {{ tool_calls_token + '[' }}
                                {%- for tool_call in block.calls -%}
                                    {{- '{"' + tool_call.name + '": ' + tool_call.arguments + '}' }}
                                    {%- if not loop.last -%}
                                        {{- ", " }}
                                    {%- endif -%}
                                {%- endfor -%}
                                {{ ']' + end_tool_calls_token }}
                                {%- set ns.waiting_for_tool_outputs = true -%}
                            {%- elif block.type == 'tool_outputs' -%}
                                {%- if ns.in_tool -%}
                                    {{- raise_exception("Cannot have both tool outputs as separate messages and tool outputs as blocks") -}}
                                {%- endif -%}
                                {{ '[' }}
                                {%- for tool_output in block.outputs -%}
                                    {{- tool_output.output }}
                                    {%- if not loop.last -%}
                                        {{- ", " }}
                                    {%- endif -%}
                                {%- endfor -%}
                                {{- ']' }}
                                {%- set ns.waiting_for_tool_outputs = false -%}
                            {%- elif block.type == 'response' -%}
                                {%- if ns.in_tool -%}
                                    {{ ']' }}
                                    {%- set ns.in_tool = false -%}
                                {%- endif -%}
                                {%- if (not loop.first and ns.in_inner) or (ns.in_assistant and ns.in_inner) -%}
                                    {%- set ns.in_inner = false -%}
                                    {{ outer_token }}
                                {%- endif -%}
                                {{ block.text }}
                            {%- else -%}
                                {{- raise_exception("Invalid assistant block type: " + block.type) -}}
                            {%- endif -%}
                        {%- endfor -%}
                    {%- else -%}
                        {{- raise_exception("Invalid assistant content") -}}
                    {%- endif -%}
                {%- else -%}
                    {{- raise_exception("Invalid assistant message") -}}
                {%- endif -%}
                {%- if "tool_calls" in message and message.tool_calls -%}
                    {{ tool_calls_token + '[' }}
                    {%- for tool_call in message.tool_calls -%}
                        {%- if tool_call.type == 'function' -%}
                            {%- set function = tool_call.function -%}
                            {%- set arguments = function.arguments if function.arguments is string else function.arguments | tojson -%}
                            {{- '{"' + function.name + '": ' + arguments + '}' }}
                            {%- if not loop.last -%}
                                {{- ", " }}
                            {%- endif -%}
                        {%- else -%}
                            {{- raise_exception("Invalid tool call type: " + tool_call.type) -}}
                        {%- endif -%}
                    {%- endfor -%}
                    {{ ']' + end_tool_calls_token }}
                    {%- set ns.waiting_for_tool_outputs = true -%}
                {%- endif -%}
            {%- elif message.role == 'tool' -%}
                {%- if not ns.in_assistant -%}
                    {{- raise_exception("Tool message outside of assistant") -}}
                {%- endif -%}
                {%- if not ns.in_tool -%}
                    {{ '[' }}
                    {%- set ns.in_tool = true -%}
                {%- else -%}
                    {{ ", "}}
                {%- endif -%}
                {{ message.content }}
                {%- set ns.waiting_for_tool_outputs = false -%}
            {%- else -%}
                {{- raise_exception("Invalid message role") -}}
            {%- endif -%}
        {%- endfor -%}
        {%- if ns.in_tool -%}
            {{ ']' }}
        {%- endif -%}
        {%- if ns.in_assistant and not (continue_assistant_message is defined and continue_assistant_message) and not ns.waiting_for_tool_outputs -%}
            {{ end_assistant_token }}
        {%- endif -%}
        {%- if add_generation_prompt -%}
            {{ assistant_token }}
        {%- endif -%}
  apertus-v1.1-0.5b-vllm: &apertus-v11
    name: Apertus v1.1 0.5B Instruct
    description: |
      The smallest Apertus, at half a billion parameters. It exists for places a real
      model will not fit: edge boxes, CPU-adjacent deployments, or as a draft model.

      Expect it to handle short instructions, simple rewriting and classification, and
      to struggle with anything requiring multi-step reasoning. It has no tool calling.

      The context window is 4096 tokens across the whole v1.1 line, so its cache cost
      is negligible and many copies fit on one card.
    url: https://huggingface.co/swiss-ai/Apertus-v1.1-0.5B-Instruct
    license: apache-2.0
    createdAt: 2026-05-01
    registeredAt: 2026-08-18
    engine: vllm
    engineSpecifier: swiss-ai/Apertus-v1.1-0.5B-Instruct
    sizing:
      # 20 layers, 4 kv heads, head_dim 64 -> 2 * 20 * 4 * 64 * 2
      kvBytesPerToken: 20480
      maxContextLength: 4096
      weightGb: 0.88  # measured resident, 0.82 GiB
      weightBits: 16
    type: chat
    family: Apertus
    tags: []
    engineVersions:
      min: "0.19.2"

  apertus-v1.1-1.5b-vllm:
    <<: *apertus-v11
    name: Apertus v1.1 1.5B Instruct
    description: |
      The middle of the Apertus v1.1 line. Noticeably more coherent than the 0.5B on
      instructions and short-form writing while still small enough to run several
      copies on one card.

      No tool calling, and a 4096-token window, so treat it as a fast worker for
      bounded tasks rather than a general assistant.
    url: https://huggingface.co/swiss-ai/Apertus-v1.1-1.5B-Instruct
    createdAt: 2026-05-03
    engineSpecifier: swiss-ai/Apertus-v1.1-1.5B-Instruct
    sizing: &apertus-15b-sizing
      # 16 layers, 8 kv heads, head_dim 64 -> 2 * 16 * 8 * 64 * 2
      kvBytesPerToken: 32768
      maxContextLength: 4096
      weightGb: 3.02  # measured resident, 2.81 GiB
      weightBits: 16

  apertus-v1.1-1.5b-nvfp4a16-vllm:
    <<: *apertus-v11
    name: Apertus v1.1 1.5B Instruct NVFP4A16
    description: |
      The 1.5B quantized to NVFP4 weights with 16-bit activations, roughly halving its
      footprint. Published by the Apertus team themselves rather than a third party.

      Same behaviour and same 4096-token window as the bf16 1.5B; pick it when you are
      packing several small models onto one card. It uses NVFP4 kernels, so it needs an
      NVIDIA GPU.
    url: https://huggingface.co/swiss-ai/Apertus-v1.1-1.5B-Instruct-vLLM-NVFP4A16
    createdAt: 2026-05-18
    engineSpecifier: swiss-ai/Apertus-v1.1-1.5B-Instruct-vLLM-NVFP4A16
    variantOf: apertus-v1.1-1.5b-vllm
    platforms: [nvidia]
    sizing:
      <<: *apertus-15b-sizing
      weightGb: 1.64  # measured resident, 1.53 GiB
      weightBits: 4

  apertus-v1.1-4b-vllm:
    <<: *apertus-v11
    name: Apertus v1.1 4B Instruct
    description: |
      The largest of the v1.1 minis and the one worth reaching for first if the card
      has room: markedly better than the 1.5B at following multi-part instructions and
      at longer-form writing.

      Still no tool calling, and still a 4096-token window, which is the binding limit
      on this whole line rather than the parameter count.
    url: https://huggingface.co/swiss-ai/Apertus-v1.1-4B-Instruct
    createdAt: 2026-05-01
    engineSpecifier: swiss-ai/Apertus-v1.1-4B-Instruct
    sizing:
      # 24 layers, 8 kv heads, head_dim 128 -> 2 * 24 * 8 * 128 * 2
      kvBytesPerToken: 98304
      maxContextLength: 4096
      weightGb: 7.66  # measured resident, 7.13 GiB
      weightBits: 16
