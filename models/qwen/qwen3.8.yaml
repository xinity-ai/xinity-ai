# yaml-language-server: $schema=https://sysinfo.xinity.ai/schemas/model.v2.json
#
# Qwen3.8: the 27B in six builds and Flash Next, on vLLM and Ollama.
# Verified on GB10; every weightGb and minKvCacheGb here is measured, not estimated, except on
# the Flash Next draft.
#
# Each variant merges the entry it is a variant of and overrides what differs, so a
# variant shows only what makes it one.

models:
  qwen3.8-27b-vllm: &qwen38-27b
    name: Qwen3.8 27B
    description: |
      Alibaba's 27B dense vision-language model, and the strongest open-weight
      release in the Qwen line to date. It reads text, images and video, and was
      tuned for long-horizon agentic work: driving a terminal, operating a
      browser, and carrying multi-step tasks through to completion.

      Thinking is on by default and this is a heavy thinker, so allow generous
      `max_tokens` or replies get cut off mid-thought. Depth is adjustable per
      request with `reasoning_effort`, which takes `xhigh` (the default),
      `medium` or `low`, in decreasing order of how much the model deliberates.
      Only those three are accepted: `minimal`, `high` and `max` are refused,
      unlike on most OpenAI-compatible models. Thinking can be switched off
      altogether with `chat_template_kwargs: {"enable_thinking": false}`. Note
      that lower effort does not reliably finish agent loops sooner, because
      shallower analysis tends to cost extra retries.

      It is sensitive to sampling settings and the two modes want different ones.
      Thinking: `temperature 1.0, top_p 0.95, top_k 20`. Non-thinking:
      `temperature 0.7, top_p 0.80, top_k 20, presence_penalty 1.5`. Greedy
      decoding is not recommended while thinking and tends to repeat.

      The window is 262K. Long context is comparatively cheap on this
      architecture, but every request in flight holds a fixed working set
      whatever its length, so a deployment runs out of concurrency well before it
      runs out of context. The 1M window described in Qwen's model card needs a
      scaling override and is not what this entry serves.
    url: https://huggingface.co/Qwen/Qwen3.8-27B
    license: apache-2.0
    createdAt: 2026-08-14
    registeredAt: 2026-08-17
    engine: vllm
    engineSpecifier: Qwen/Qwen3.8-27B
    # 64 layers: 16 full attention + 48 linear, 4 kv heads, head_dim 256.
    #   kvBytesPerToken       = 2 * 16 * 4 * 256 * 2   = 65536
    #   block size 784, mamba page padded to 3,211,264
    #   stateBytesPerSequence = 3,211,264 * 48         = 154,140,672
    # minKvCacheGb is authored, not derived: whole-block allocation puts the floor above
    # the 17.34 those two imply, and it moves when the engine changes how it pages
    # recurrent state. Bracketed: 17.57 aborts, 17.58 starts at 1.00x; quantization and
    # disabling vision do not change it. Re-bracket after an engine upgrade rather than
    # deriving - packages/xinity-infoserver/docs/integrating-a-model.md says how.
    sizing: &sizing-27b-bf16
      kvBytesPerToken: 65536
      attentionHeads: 24
      kvHeads: 4
      stateBytesPerSequence: 154140672
      minKvCacheGb: 17.58
      maxContextLength: 262144
      weightGb: 54.9   # measured resident, 51.1 GiB; the safetensors sum higher
      layers: 64
      attentionLayers: 16
      stateLayers: 48
      nonLayerWeightGb: 6.01
      weightBits: 16
    type: chat
    family: Qwen3.8
    tags: [vision, tools]
    # The tags add --enable-auto-tool-choice; vLLM still needs the parsers named.
    engineArgs: &parsers
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    # Non-standard extras only. Standard OpenAI fields are the gateway's job, not this
    # file's.
    requestParams:
      top_k: number
      min_p: number
      repetition_penalty: number
      chat_template_kwargs.enable_thinking: boolean
    engineVersions:
      min: "0.19.2"

  qwen3.8-27b-fp8-vllm:
    <<: *qwen38-27b
    name: Qwen3.8 27B FP8
    description: |
      Qwen's own FP8 build, a little over half the size of the bf16 entry for
      very close quality. The vision tower is left at full precision, so image
      and video understanding is not the part that pays for the quantization.

      Pick it over bf16 when the memory saved is better spent on serving more
      requests at once than on weight precision.

      Thinking, `reasoning_effort`, sampling and context behave exactly as on the
      bf16 entry.
    url: https://huggingface.co/Qwen/Qwen3.8-27B-FP8
    engineSpecifier: Qwen/Qwen3.8-27B-FP8
    variantOf: qwen3.8-27b-vllm
    sizing: &sizing-27b-fp8
      <<: *sizing-27b-bf16
      weightGb: 30.6   # measured resident, 28.51 GiB
      weightBits: 8

  qwen3.8-27b-nvfp4-vllm:
    <<: *qwen38-27b
    name: Qwen3.8 27B NVFP4
    description: |
      The smallest build of Qwen3.8 27B that still does vision. It runs NVFP4
      kernels, so it needs a Blackwell-class NVIDIA GPU and will not be scheduled
      anywhere else.

      Despite the 4-bit name, much of the checkpoint stays at higher precision,
      so it lands at 26 GB rather than the ~14 GB the label suggests. That is
      meaningfully smaller than FP8, not dramatically so.

      This is a third-party requantization rather than a Qwen build, so it was
      checked harder than the official entries: a twelve-prompt battery spanning
      arithmetic, sequence reasoning, translation, code and factual recall
      returned twelve correct answers with no empty or truncated replies.

      Thinking, `reasoning_effort`, sampling and context behave exactly as on the
      bf16 entry.
    url: https://huggingface.co/Inferact/Qwen3.8-27B-NVFP4
    engineSpecifier: Inferact/Qwen3.8-27B-NVFP4
    variantOf: qwen3.8-27b-vllm
    platforms: [nvidia]
    sizing:
      <<: *sizing-27b-bf16
      weightGb: 26.0   # measured resident, 24.18 GiB
      hostWeightGb: 0
      weightBits: 4

  qwen3.8-27b-nvfp4-mtp-vllm:
    <<: *qwen38-27b
    name: Qwen3.8 27B NVFP4 (fast decode)
    description: |
      The NVFP4 build with speculative decoding enabled: the same weights and the
      same answers, roughly 1.5x more tokens per second for a single stream. The exact
      figure moves with the engine, which decides how often a speculated token is
      accepted; measured between 1.45x and 1.7x.

      That speedup is a low-concurrency effect. It is largest when the GPU is
      otherwise idle and shrinks as more requests share the card, so choose this
      entry for latency-sensitive single-stream work and the plain NVFP4 entry
      for throughput serving. It also needs about 2.4 GB more than plain NVFP4,
      across both weights and cache.

      Tool calling, vision, `reasoning_effort` and context behave exactly as on the
      bf16 entry. Sampling does too, with one exception: `min_p` is rejected with an
      error, because vLLM does not support it alongside speculative decoding. Use
      `top_k` and `repetition_penalty` instead, or the plain NVFP4 entry if a workload
      really needs `min_p`.

      Thinking is off here and this entry does not offer the switch. On vLLM 0.26 and
      older, speculative decoding and thinking together corrupt structured output:
      close to half of all schema-constrained replies come back malformed, in a way the
      response grammar should have made impossible. vLLM 0.29 fixes that, but the entry
      still serves thinking off so that it behaves the same on every engine version it
      supports. If a workload needs a chain of thought and a response schema at once,
      use the plain NVFP4 entry.
    url: https://huggingface.co/Inferact/Qwen3.8-27B-NVFP4
    engineSpecifier: Inferact/Qwen3.8-27B-NVFP4
    variantOf: qwen3.8-27b-vllm
    platforms: [nvidia]
    sizing:
      <<: *sizing-27b-bf16
      weightGb: 26.8   # measured resident with the MTP head, 24.99 GiB
      attentionLayers: 17
      weightBits: 4
      # The MTP head is an extra decoder layer carrying its own KV, so only the floor
      # moves. Bracketed: 19.16 aborts, 19.17 starts at 1.00x.
      minKvCacheGb: 19.17
    # The shared list offers chat_template_kwargs.enable_thinking; this build must not,
    # so the allowlist is replaced rather than inherited. See the description. min_p is
    # dropped too: vLLM rejects it under speculative decoding with HTTP 400 ("not yet
    # supported with speculative decoding").
    requestParams:
      top_k: number
      repetition_penalty: number
    engineArgs:
      # engineArgs are deep-flattened on load, so this composes with the shared list.
      # n=3 was chosen by measurement: n=1 reaches only 1.47x against this 1.68x.
      - *parsers
      # Thinking off at the engine as well as absent from requestParams: the flag is a
      # default and a request can still override it, so the allowlist is what enforces.
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'

  # The two entries below serve the same checkpoints with the vision tower left unbuilt:
  # --language-model-only really does skip loading it, ~0.9 GB off the weights, after
  # which images are refused with HTTP 400. The KV floor is unchanged.
  qwen3.8-27b-blind-vllm:
    <<: *qwen38-27b
    name: Qwen3.8 27B (text-only)
    description: |
      Qwen3.8 27B bf16 with vision switched off. The same text model as the
      standard entry and identical to it on text and tool calling; it simply
      cannot accept images or video.

      Pick it for a text-only deployment where you want that guaranteed rather
      than assumed: image requests are refused outright instead of quietly
      consuming tokens on a modality nobody meant to use. It saves about 1 GB, so
      memory alone is a weak reason to choose it over the standard entry.

      Thinking, `reasoning_effort`, sampling and context behave exactly as on the
      bf16 entry.
    variantOf: qwen3.8-27b-vllm
    tags: [tools]
    sizing:
      <<: *sizing-27b-bf16
      weightGb: 53.9   # measured resident with the tower unbuilt, 50.22 GiB
      nonLayerWeightGb: 5.09
    engineArgs: &parsers-blind
      - *parsers
      - --language-model-only

  qwen3.8-27b-fp8-blind-vllm:
    <<: *qwen38-27b
    name: Qwen3.8 27B FP8 (text-only)
    description: |
      Qwen3.8 27B FP8 with vision switched off: the smallest way to run this
      model on any vendor's hardware, and text-only by construction rather than
      by convention.

      Image requests are refused outright, which is the point of the entry.
      Choose the NVFP4 entry instead if you want smaller still and are on
      Blackwell-class NVIDIA hardware.

      Thinking, `reasoning_effort`, sampling and context behave exactly as on the
      bf16 entry.
    url: https://huggingface.co/Qwen/Qwen3.8-27B-FP8
    engineSpecifier: Qwen/Qwen3.8-27B-FP8
    variantOf: qwen3.8-27b-vllm
    tags: [tools]
    sizing:
      <<: *sizing-27b-fp8
      weightGb: 29.7   # measured resident with the tower unbuilt, 27.64 GiB
      nonLayerWeightGb: 5.09
    engineArgs: *parsers-blind

  # DRAFT until the run across two GX10s: weightGb, stateBytesPerSequence and engineVersions.min
  # are estimates and minKvCacheGb is not bracketed yet.
  qwen3.8-flash-next-fp8-vllm: &qwen38-flash-next
    name: Qwen3.8 Flash Next FP8
    description: |
      Qwen's 180B mixture-of-experts vision-language model, of which only a small
      fraction runs per token. It reads text, images and video, and was built for
      long-horizon agentic work and coding.

      Thinking is on by default. Depth is adjustable per request with
      `reasoning_effort` (`xhigh`, `medium` or `low`). Only those three are
      accepted: `minimal`, `high` and `max` are refused, unlike on most
      OpenAI-compatible models. Thinking can be switched off with
      `chat_template_kwargs: {"enable_thinking": false}`. The window is 262K.
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8
    license:
      name: Qwen Community License 1.0
      url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8/blob/main/LICENSE
      use: conditional
      summary: |
        Free to use, modify and deploy, and unrestricted for internal use. Offering it
        to third parties as a model service or an AI coding or office assistant needs
        a separate license from Qwen, and a product above 100 million monthly users or
        US$20 million monthly revenue must display the model name.
    createdAt: 2026-08-24
    registeredAt: 2026-10-14
    engine: vllm
    engineSpecifier: Qwen/Qwen3.8-Flash-Next-FP8
    # 48 layers: 12 full attention + 36 linear, 2 kv heads, head_dim 256.
    #   kvBytesPerToken       = 2 * 12 * 2 * 256 * 2   = 24576, without the sparse-attention indexer
    #   the linear layers match Qwen3.8 27B, so its measured 3,211,264 page carries over
    #   stateBytesPerSequence = 3,211,264 * 36         = 115,605,504
    sizing:
      kvBytesPerToken: 24576
      attentionHeads: 24
      kvHeads: 2
      stateBytesPerSequence: 115605504
      maxContextLength: 262144
      weightGb: 185.6   # estimate, 172.78 GiB checkpoint
      weightBits: 8
    type: chat
    family: Qwen3.8
    tags: [vision, tools]
    # Plain tensor parallel collides with the checkpoint's 128-wide FP8 blocks.
    engineArgs:
      - *parsers
      - --enable-expert-parallel
    requestParams:
      chat_template_kwargs.enable_thinking: boolean
    engineVersions:
      min: "0.30.0"   # from the vLLM recipe, not yet bracketed

  qwen3.8-flash-next-nvfp4-vllm: &qwen38-flash-next-nvfp4
    <<: *qwen38-flash-next
    name: Qwen3.8 Flash Next NVFP4
    url: https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4
    engineSpecifier: nvidia/Qwen3.8-Flash-Next-NVFP4
    variantOf: qwen3.8-flash-next-fp8-vllm
    platforms: [nvidia]
    license:
      name: NVIDIA Open Model License and Qwen Community License 1.0
      url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/
      use: conditional
      summary: |
        NVIDIA's quantization of a Qwen model, bound by both licenses. Free to use, modify
        and deploy, and unrestricted for internal use. Offering it to third parties as a
        model service or an AI coding or office assistant needs a separate license from
        Qwen, and a product above 100 million monthly users or US$20 million monthly
        revenue must display the model name. Rights end if its safety guardrails are
        circumvented without an equivalent, and redistributing the weights requires
        NVIDIA's license and notice.
    # minKvCacheGb is authored: every attention layer also keeps the sparse-attention indexer's
    # compressed keys, which no rank splits. Bracketed across two nodes: 7.28 aborts, 7.29
    # starts at 1.01x.
    sizing: &sizing-flash-next-nvfp4
      kvBytesPerToken: 24576
      attentionHeads: 24
      kvHeads: 2
      stateBytesPerSequence: 115458048
      minKvCacheGb: 7.29
      maxContextLength: 262144
      weightGb: 132.6   # measured resident, 37.9 GiB per card across two plus the n-gram table
      layers: 48
      attentionLayers: 12
      stateLayers: 36
      nonLayerWeightGb: 3.45
      activeWeightGb: 9.95
      hostWeightGb: 51.2   # the n-gram embedding, kept in pinned host memory by the engine
      weightBits: 4

  qwen3.8-flash-next-nvfp4-mtp-vllm: &qwen38-flash-next-nvfp4-mtp
    <<: *qwen38-flash-next-nvfp4
    name: Qwen3.8 Flash Next NVFP4 (fast decode)
    description: |
      The NVFP4 build with speculative decoding enabled: the same weights and the
      same answers, more tokens per second for a single stream. Measured between
      1.3x and 1.45x on prose against the plain NVFP4 entry.

      That speedup is a low-concurrency effect. It is largest when the cards are
      otherwise idle and shrinks as more requests share them, so choose this entry
      for latency-sensitive work and the plain NVFP4 entry for throughput serving.
      For mostly code, the code entry speculates one token further.

      Thinking, `reasoning_effort` and the window behave exactly as on the plain
      entry.
    # The MTP head is one more attention layer with its own cache and indexer, so the floor moves.
    # Bracketed across two nodes: 8.06 aborts, 8.07 starts at 1.01x.
    sizing:
      <<: *sizing-flash-next-nvfp4
      weightGb: 135.5   # measured resident with the MTP head, 39.26 GiB per card across two
      attentionLayers: 13
      minKvCacheGb: 8.07
    engineArgs:
      - *parsers
      - --enable-expert-parallel
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":1}'

  qwen3.8-flash-next-nvfp4-mtp-code-vllm:
    <<: *qwen38-flash-next-nvfp4-mtp
    name: Qwen3.8 Flash Next NVFP4 (fast decode, code)
    description: |
      The fast decode entry tuned for code: it speculates two tokens ahead instead
      of one, because code repeats enough for the second token to be kept. Measured
      about a fifth faster than the fast decode entry on code, and slower than it
      on prose.

      Thinking, `reasoning_effort` and the window behave exactly as on the plain
      entry.
    # Bracketed across two nodes: 8.23 aborts, 8.24 starts at 1.01x.
    sizing:
      <<: *sizing-flash-next-nvfp4
      weightGb: 135.5   # measured resident with the MTP head, 39.26 GiB per card across two
      attentionLayers: 13
      minKvCacheGb: 8.24
    engineArgs:
      - *parsers
      - --enable-expert-parallel
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'

  qwen3.8-27b-ollama: &q38-ollama
    name: Qwen3.8 27B (Ollama)
    description: |
      The same Qwen3.8 27B as the vLLM entries, served by Ollama from the library GGUF.
      It reads images, calls tools, and takes the full 262K window.

      This entry is the 4-bit build, which is the practical default: it fits in under
      17 GB and leaves room on the node for something else. The q8 entry roughly doubles
      the memory and sits closest to the vLLM FP8 entry.

      Under Ollama it answers directly rather than reasoning first.
    url: https://ollama.com/library/qwen3.8
    license: apache-2.0
    createdAt: 2026-08-14
    registeredAt: 2026-09-26
    engine: ollama
    engineSpecifier: qwen3.8:27b
    variantOf: qwen3.8-27b-vllm
    sizing: &q38-ollama-kv
      # Hybrid attention, so only some layers hold a KV cache and the rest keep a fixed
      # per-request state. Both figures are the vLLM entry's verified values for the same
      # model rather than ones derived from Ollama's metadata.
      kvBytesPerToken: 65536
      stateBytesPerSequence: 154140672
      maxContextLength: 262144
      weightGb: 16.81
      weightBits: 4
    type: chat
    family: Qwen3.8
    tags: [vision, tools]
    engineVersions:
      min: "0.33.1"

  qwen3.8-27b-q8-ollama:
    <<: *q38-ollama
    name: Qwen3.8 27B Q8 (Ollama)
    description: |
      Qwen3.8 27B in an 8-bit build, close to the vLLM FP8 entry's precision at a little
      under 30 GB. Vision, tool calling and the 262K window behave as on the 4-bit entry.

      Take this when the 4-bit build's answers are not good enough and the node has the
      memory to spare.
    engineSpecifier: qwen3.8:27b-q8_0
    sizing:
      <<: *q38-ollama-kv
      weightGb: 29.05
      weightBits: 8
