# yaml-language-server: $schema=https://sysinfo.xinity.ai/schemas/model.v2.json
#
# Migrated from the v1 registry, which carried these as `qwen3.6-*` with a `providers`
# map. The sizing figures are derived from the v1 `minKvCache` values that were
# established by running the models, but the per-token and per-sequence breakdowns are
# inferred rather than read off config.json. Each anchor below records how.

# Anchors only. The envelope keeps `includes` and `models`, so this key is ignored on load.
x-shared:
  # True of every entry in this file, so a licence or tag change is one edit.
  common: &common
    license: apache-2.0
    type: chat
    family: Qwen3
    engine: vllm
    registeredAt: 2026-08-17
    tags: [vision, tools]
    requestParams:
      chat_template_kwargs.enable_thinking: boolean

  # engineArgs are deep-flattened on load, so an entry composes fragments as a nested list.
  generationArgs: &generation-args
    - --tool-call-parser
    - qwen3_coder
    - --reasoning-parser
    - qwen3

  hybridArgs: &hybrid-args
    - --mm-processor-cache-type
    - shm
    - --mamba-cache-mode
    - align
    - --default-chat-template-kwargs
    - '{"enable_thinking": false}'

  denseArgs: &dense-args
    - --max-model-len
    - "262144"

  # Hybrid attention/Mamba MoE, shared by both 35B-A3B variants: quantizing the weights
  # leaves the KV dtype alone, so the cache cost is identical. kvBytesPerToken is inferred
  # from the v1 floor of 7 GB at 262144 context, where 2 * 12 * 4 * 128 * 2 gives 6.44 GB
  # and the remainder is the state the `align` cache mode reserves per sequence. Both want
  # confirming against what vLLM reports for the KV and state caches at startup.
  hybridCache: &hybrid-cache
    kvBytesPerToken: 24576
    stateBytesPerSequence: 20000000
    maxContextLength: 262144

  # Dense, so full KV on every layer and no per-sequence state. 2 * 32 * 4 * 128 * 2
  # reproduces the v1 floor of 17.37 GB to within one percent, which is the strongest
  # confirmation available without reading config.json.
  denseCache: &dense-cache
    kvBytesPerToken: 65536
    maxContextLength: 262144

models:
  qwen3.6-35b-a3b-vllm:
    <<: *common
    name: Qwen3.6 35B A3B
    description: |
      Latest-generation Qwen vision-language model. Multimodal (text + image), tool
      calling, 256k context. Replaces Qwen3.5 as the recommended Qwen vision default.

      Thinking mode is disabled by default; output is direct unless
      `chat_template_kwargs.enable_thinking: true` is passed on the request. The FP8
      Thinking variant has thinking enabled by default.

      A hybrid architecture: most layers are linear attention, so it holds far less KV
      per token than a dense model of the same size, and instead reserves a fixed
      recurrent state for every request in flight.
    url: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
    createdAt: 2026-04-30
    engineSpecifier: Qwen/Qwen3.6-35B-A3B
    minEngineVersion: 0.19.2rc1
    sizing:
      <<: *hybrid-cache
      weightGb: 70
      activeWeightGb: 7
      weightBits: 16
    engineArgs: [*generation-args, *hybrid-args]

  qwen3.6-35b-a3b-fp8-vllm:
    <<: *common
    name: Qwen3.6 35B A3B FP8
    description: |
      Quantized Qwen3.6 vision-language model. Multimodal capability, tool calling, and
      256k context match the standard release. Reduced memory use supports higher
      concurrency or longer contexts.

      Thinking mode is disabled by default; output is direct unless
      `chat_template_kwargs.enable_thinking: true` is passed on the request.

      The KV cache is unaffected by the weight quantization, so this variant needs the
      same cache as the bf16 one and differs only in what the weights occupy.
    url: https://huggingface.co/Qwen/Qwen3.6-35B-A3B-FP8
    createdAt: 2026-04-30
    engineSpecifier: Qwen/Qwen3.6-35B-A3B-FP8
    minEngineVersion: 0.19.2rc1
    variantOf: qwen3.6-35b-a3b-vllm
    sizing:
      <<: *hybrid-cache
      weightGb: 35
      activeWeightGb: 4
      weightBits: 8
    engineArgs: [*generation-args, *hybrid-args]

  qwen3.6-27b-vllm:
    <<: *common
    name: Qwen3.6 27B
    description: |
      Qwen3.6 27B dense vision-language model at full bf16 precision, focused on agentic
      coding and reasoning. Accepts text, image, and video input; tool calling, 256k
      context.

      Thinking mode is on by default, so the model emits a reasoning preamble before its
      final answer and output token budgets must accommodate both.
    url: https://huggingface.co/Qwen/Qwen3.6-27B
    createdAt: 2026-06-25
    engineSpecifier: Qwen/Qwen3.6-27B
    minEngineVersion: 0.19.0
    sizing:
      <<: *dense-cache
      weightGb: 54.9
      weightBits: 16
    engineArgs: [*generation-args, *dense-args]

  qwen3.6-27b-fp8-vllm:
    <<: *common
    name: Qwen3.6 27B FP8
    description: |
      Quantized Qwen3.6 27B dense vision-language model (block-scaled e4m3 FP8). Agentic
      coding focus, text/image/video input, tool calling, and 256k context match the bf16
      release; reduced memory use supports higher concurrency or longer contexts.

      Thinking mode is on by default.
    url: https://huggingface.co/Qwen/Qwen3.6-27B-FP8
    createdAt: 2026-06-25
    engineSpecifier: Qwen/Qwen3.6-27B-FP8
    minEngineVersion: 0.19.0
    variantOf: qwen3.6-27b-vllm
    sizing:
      <<: *dense-cache
      weightGb: 30.6
      weightBits: 8
    engineArgs: [*generation-args, *dense-args]
