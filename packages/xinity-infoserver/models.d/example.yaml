# yaml-language-server: $schema=../models.v2.schema.json
# Example entries in the current model format. One entry describes one model on
# one engine, so the specifier carries the engine and every number below is
# correct for that variant specifically.

models:
  phi-3-vision-vllm:
    name: Phi-3 Vision
    description: |
      Compact vision-language model that reads images alongside text, tuned for
      document and chart understanding at a size that fits a single mid-range GPU.

      Its 128K context takes a whole document in one request. Noticeably weaker
      than larger VLMs at open-ended visual reasoning, so prefer it for
      extraction and summarisation over analysis.
    url: https://huggingface.co/microsoft/Phi-3-vision-128k-instruct
    license: mit
    createdAt: 2024-05-21
    registeredAt: 2026-08-10
    engine: vllm
    engineSpecifier: microsoft/Phi-3-vision-128k-instruct
    sizing:
      weightGb: 8
      minKvCacheGb: 2
      maxContextLength: 128000
    type: chat
    family: phi3
    tags: [vision, custom_code]

  qwen3-coder-next-large-ollama:
    name: Qwen Coder Next
    description: |
      Code model for editing and completion across large repositories, with tool
      calling reliable enough to drive an agent loop.

      This is the q8 variant, which trades a little accuracy on long refactors for
      roughly half the VRAM of the fp16 entry. Pick it when a single 24GB card has
      to serve both this and something else.
    url: https://ollama.com/library/qwen3-coder-next
    license: apache-2.0
    createdAt: 2026-06-18
    registeredAt: 2026-06-24
    engine: ollama
    engineSpecifier: qwen3-coder-next:q8_0
    sizing:
      weightGb: 14
      activeWeightGb: 3
      weightBits: 8
      minKvCacheGb: 4
      kvBytesPerToken: 24576
      maxContextLength: 131072
    type: chat
    family: qwen3
    variantOf: qwen3-coder-next-large-vllm
    tags: [tools]

  # The standard variant of this model, so it carries no variantOf and the entry above
  # points at it. Same underlying model, different engine and quantization, which is
  # why it is a separate entry with its own capacity numbers and its own specifier.
  qwen3-coder-next-large-vllm:
    name: Qwen Coder Next
    description: |
      Code model for editing and completion across large repositories, with tool
      calling reliable enough to drive an agent loop.

      The fp16 variant, and the one to use when accuracy on long multi-file changes
      matters more than footprint. Needs roughly twice the VRAM of the q8 Ollama
      entry and a recent vLLM for the tool-call parser.
    url: https://huggingface.co/Qwen/Qwen3-Coder-Next
    license: apache-2.0
    createdAt: 2026-06-18
    registeredAt: 2026-06-24
    engine: vllm
    engineSpecifier: Qwen/Qwen3-Coder-Next
    sizing:
      weightGb: 28
      activeWeightGb: 6
      weightBits: 16
      minKvCacheGb: 6
      kvBytesPerToken: 49152
      maxContextLength: 131072
    type: chat
    family: qwen3
    tags: [tools]
    engineArgs: ["--tool-call-parser", "hermes"]
    minEngineVersion: "0.19.1"

  # Kept deployable but out of the picker. Anything already running it is unaffected,
  # and a user who wants it can still unhide or name it exactly.
  qwen2-coder-medium-vllm:
    name: Qwen2 Coder
    description: |
      Earlier generation code model, superseded in practice by the Qwen3 entries above
      on every task we measure.

      Still here because evaluation baselines and tuned prompts are pinned to it.
    url: https://huggingface.co/Qwen/Qwen2-Coder
    license: apache-2.0
    createdAt: 2024-09-19
    registeredAt: 2025-12-03
    engine: vllm
    engineSpecifier: Qwen/Qwen2-Coder
    sizing:
      weightGb: 14
      minKvCacheGb: 4
      maxContextLength: 32768
    type: chat
    family: qwen2
    tags: [tools]
    unlisted: true
    unlistedReason: Superseded by the Qwen3 Coder entries. Prefer those unless you are pinned to this one.

  # Illustrative vendor license, written out in full because it is not one of the
  # well-known identifiers. Commercial use is allowed but bounded, so the summary
  # names the bound: it is what the dashboard puts in front of a user before deploy.
  atlas-vision-12b-vllm:
    name: Atlas Vision 12B
    description: |
      Vision-language model for document and diagram understanding, strong at
      reading dense tables and handwritten annotations in one pass.

      Answers in the language of the prompt rather than the document, which is
      worth knowing when extracting from mixed-language scans.
    url: https://example.com/atlas/vision-12b
    license:
      name: Atlas Open Weights License 1.1
      url: https://example.com/atlas/license
      use: conditional
      summary: >
        Free for research and for commercial use below $10M annual revenue. Above
        that threshold, deployment requires a commercial agreement with the publisher.
    createdAt: 2026-07-30
    registeredAt: 2026-08-04
    engine: vllm
    engineSpecifier: atlas-ai/Atlas-Vision-12B
    sizing:
      weightGb: 24
      minKvCacheGb: 6
      maxContextLength: 131072
    type: chat
    family: atlas
    tags: [vision]

  # Well-known but not open source. The identifier is enough: the restriction and
  # the sentence explaining it come from the server's license table, not from here.
  helix-r1-7b-vllm:
    name: Helix R1 7B
    description: |
      Research reasoning model that emits an explicit chain of thought before its
      answer, tuned for maths and competitive programming problems.

      Verbose by construction, so give it generous output limits. Weaker than its
      size suggests on open-ended chat, which it was not tuned for.
    url: https://example.com/helix/r1-7b
    license: cc-by-nc-4.0
    createdAt: 2026-07-15
    registeredAt: 2026-08-08
    engine: vllm
    engineSpecifier: helix-research/Helix-R1-7B
    sizing:
      weightGb: 14
      minKvCacheGb: 4
      maxContextLength: 65536
    type: chat
    family: helix
