# Xinity AI: nginx reverse proxy template
#
# Copy the relevant blocks into your nginx configuration and replace every
# CHANGEME. See docs/security/reverse-proxy.md for the reasoning behind each
# setting, and for what nginx's defaults break if you omit them.
#
# Tested against nginx 1.24+. Where a directive needs a newer nginx, it is noted
# inline.

# ---------------------------------------------------------------------------
# http {} context
# ---------------------------------------------------------------------------

# Volumetric per-IP limits. These are a complement to, not a replacement for,
# the gateway's own auth load shedding: nginx caps request volume, the gateway
# caps how much of its DB pool unauthenticated traffic may occupy.
#
# Note that per-IP buckets are weak against IPv6, where a single client
# typically holds an entire /64 and can rotate addresses freely. nginx cannot
# truncate $binary_remote_addr to a prefix, so treat this as noise reduction
# rather than a hard guarantee.
limit_req_zone $binary_remote_addr zone=xinity_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=xinity_conn:10m;

# Streaming responses hold a connection open for the length of the generation,
# so keep the upstream keepalive pool comfortably above your peak concurrency.
upstream xinity_gateway {
    server 127.0.0.1:4010;   # CHANGEME: gateway HOST:PORT
    keepalive 32;
}

upstream xinity_dashboard {
    server 127.0.0.1:5173;   # CHANGEME: dashboard HOST:PORT
    keepalive 16;
}

# ---------------------------------------------------------------------------
# API gateway
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                # nginx >= 1.25.1; older: `listen 443 ssl http2;`
    server_name api.example.com;   # CHANGEME

    ssl_certificate     /etc/ssl/certs/CHANGEME.pem;
    ssl_certificate_key /etc/ssl/private/CHANGEME.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Multimodal requests carry images inline as base64 data URLs. The gateway
    # accepts images up to 40 MB, which is ~54 MB once base64-encoded, and audio
    # uploads to /v1/audio/transcriptions are multipart. nginx defaults to 1 MB,
    # which rejects both.
    client_max_body_size 64m;
    client_body_timeout 120s;

    # /metrics is Prometheus exposition. It is only password protected when
    # METRICS_AUTH is set on the gateway, and is fully public when it is not, so
    # deny it at the edge and scrape over the internal network instead.
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass http://xinity_gateway;

        # HTTP/1.1 plus an empty Connection header is what lets the keepalive
        # pool above actually be reused.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: the gateway streams text/event-stream for every
        # `"stream": true` completion. nginx buffers proxied responses by
        # default, which withholds tokens until the generation finishes and
        # makes streaming look broken.
        proxy_buffering off;
        proxy_cache off;

        # Generations legitimately run for minutes. The gateway's own ceilings
        # are BACKEND_TIMEOUT_MS (default 300s) and IDLE_TIMEOUT (default 255s);
        # stay just above them so the gateway, not nginx, produces the error.
        # nginx defaults to 60s, which truncates long completions mid-stream.
        proxy_connect_timeout 10s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;

        # Tune to your traffic: the burst has to absorb a client opening several
        # streams at once. Too tight here is indistinguishable from an outage.
        limit_req zone=xinity_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn xinity_conn 64;
        limit_conn_status 429;
    }
}

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;   # CHANGEME

    ssl_certificate     /etc/ssl/certs/CHANGEME.pem;
    ssl_certificate_key /etc/ssl/private/CHANGEME.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://xinity_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# Redirect plain HTTP
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com dashboard.example.com;   # CHANGEME
    return 301 https://$host$request_uri;
}
